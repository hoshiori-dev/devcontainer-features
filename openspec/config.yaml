schema: spec-driven

# Injected by OpenSpec into every artifact's instructions. It points to the knowledge base rather
# than restating it; the specification contract is .agents/knowledge/spec-workflow.md.
context: |
  This repository develops Dev Container Features, one per folder under src/<id>/, each published
  independently to ghcr.io/hoshiori-dev/devcontainer-features/<id> with its own SemVer version.
  There is one OpenSpec capability per feature and its path equals the feature id (flat layout).
  Changes to the harness, scripts, CI, or documents set `skip_specs: true` and carry no delta spec.
  Before writing an artifact, read .agents/knowledge/feature-authoring.md (conventions, idempotency,
  versions) and .agents/knowledge/testing.md (compatibility lists, test types). Write every artifact
  in English.

rules:
  proposal:
    - Describe the end state, not the approach; the roles of proposal, specs, design, and tasks are in the "Artifact roles" section of .agents/knowledge/spec-workflow.md.
    - Name the capabilities whose contracts change; never restate a requirement or scenario.
    - End with "## Acceptance" holding two lists of checkable items, "Becomes true" and "Stays true" (invariants that must hold under any approach); for feature behavior, point to the delta specs' scenarios.
    - Name every feature id the change touches and the version bump each needs, per .agents/knowledge/feature-authoring.md.
    - Link the GitHub issue the change implements.
  specs:
    - One capability per feature; the capability path is the feature id.
    - 'A new capability''s Purpose opens with one or two sentences on what the feature installs, then ends with an "Upstream sources:" list of reference links that do not shape behavior, one `- <label>: <url>` entry each — for example the upstream home or README, its documentation root, its installation guide, and its changelog. Link stable entry pages, not deep anchors.'
    - When an upstream source shapes behavior (download location, checksum or signature verification, signing keys), state it and its URL as a Requirement and leave it out of the "Upstream sources:" list; each URL lives in one place.
    - A delta spec holds only `## Purpose` (new capabilities only) and ADDED, MODIFIED, REMOVED, or RENAMED Requirements sections; archive silently drops any other section. The Purpose of an existing spec changes only by hand (.agents/knowledge/spec-workflow.md, Scope of specifications).
    - When the feature knowingly leaves a risk in place, state the risk and its reason in the Requirement that defines the behavior carrying it (.agents/knowledge/feature-authoring.md, Developer trust and readability); never restate a risk the whole collection accepts.
    - Refer to test/<id>/compatibility.json for supported images; never list images in a spec.
    - State each option as its own Option requirement in the format of "Option requirements" in .agents/knowledge/spec-workflow.md; leave proposals and description to devcontainer-feature.json.
    - Include a requirement stating what installing the feature a second time, with the same or different options, does.
  design:
    - Describe how the proposal's end state is reached; never restate its goal or acceptance (see "Artifact roles" in .agents/knowledge/spec-workflow.md).
    - Put in Goals / Non-Goals the constraints and invariants of the chosen approach, each with how it is checked; put information needed only for this change in Context.
    - Write one for every new feature and for any change to options, dependencies, or security-sensitive metadata. For options, a table lists every option the change adds, changes, renames, or removes (name, type, default, enum or proposals, meaning), followed by the reason for each default and the rejected option shapes (.agents/knowledge/spec-workflow.md, Source of truth).
    - Record the chosen upstream source and verification method, the rejected alternatives, and research needed only for this change.
    - State bounds, not steps. Never include secrets, credentials, or private data.
  tasks:
    - Write tasks.md only after a maintainer approved the approval package (proposal, delta specs, design when warranted) in the current conversation. Without that approval, do not create this file; stop and report that the approval package is ready for review.
    - For a feature change, cover install.sh, test.sh, duplicate.sh, scenarios, compatibility.json, NOTES.md, the version bump, and regenerating the README with `just docs`.
    - End with running `just check` (for a feature change also `just test <id>` and `just test-scenarios <id>`) and recording the results in the PR's Validation section.
    - Never add a task to archive or sync; that happens only on a maintainer's command.

operations:
  apply:
    guidance:
      - Implement only after a maintainer approved the specification in the current conversation; otherwise stop and ask.
      - When every task is done, do not suggest or run archive or sync; follow the Finish steps of the github-project-workflow skill.
  archive:
    guidance:
      - Archive or sync only when a maintainer explicitly commanded it in the current conversation; otherwise stop and ask.
