# Pull-request metadata checks. They depend on the title, the description, and the draft state, so
# they rerun on edits and on ready/draft transitions without rerunning CI. Each job is a required
# check; job map: .agents/knowledge/github/checks.md.
name: PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tools
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: ./scripts/check_title.ts "$TITLE"

  pr-checklist:
    # Dependabot writes its own description; its PRs change no behavior and carry no spec.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tools
      - run: ./scripts/check_pr_body.ts --template .github/pull_request_template.md

  spec-archived:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tools
      - env:
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [[ "$DRAFT" == "true" ]]; then ./scripts/check_spec_archived.ts; else ./scripts/check_spec_archived.ts --ready; fi
