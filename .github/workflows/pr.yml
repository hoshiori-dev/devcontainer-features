# Pull-request metadata checks. They depend on the title, the description, and the draft state, so
# they rerun on edits and on ready/draft transitions without rerunning CI. Each job is a required
# check; job map: .agents/knowledge/github/checks.md.
name: PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tools
      - env:
          TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: ./scripts/check_title.ts "$TITLE"

  pr-checklist:
    # Dependabot writes its own description; its PRs change no behavior and carry no spec.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tools
      # The template comes from the base commit, so a PR cannot drop a required section by deleting it from
      # both the template and its own description. Only a base without a template (the bootstrap) uses this
      # branch's copy.
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          template=.github/pull_request_template.md
          git fetch --no-tags --depth 1 origin "$BASE_SHA"
          if git cat-file -e "$BASE_SHA:$template" 2>/dev/null; then
            git show "$BASE_SHA:$template" > "$RUNNER_TEMP/pull_request_template.md"
            template="$RUNNER_TEMP/pull_request_template.md"
          else
            echo "::notice::The base branch has no $template yet; checking against this branch's copy."
          fi
          ./scripts/check_pr_body.ts --template "$template"

  spec-archived:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tools
      - env:
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [[ "$DRAFT" == "true" ]]; then ./scripts/check_spec_archived.ts; else ./scripts/check_spec_archived.ts --ready; fi
