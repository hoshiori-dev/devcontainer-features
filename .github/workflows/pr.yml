# Pull-request metadata checks. They rerun on edits and on ready/draft transitions without rerunning
# CI. `pr-title`, `pr-checklist`, and `spec-archived` are required checks; job map:
# .agents/knowledge/github/checks.md.
name: PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each job runs the base commit's copy of its script (.github/actions/base-checks), so a pull
  # request cannot relax a check by editing the script or the template it reads. This workflow and
  # its actions still come from the pull request; review is what guards edits to them.
  pr-title:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - id: base
        uses: ./.github/actions/base-checks
        with:
          files: scripts/check_title.ts
      - working-directory: ${{ steps.base.outputs.root }}
        env:
          TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: ./scripts/check_title.ts "${TITLE}"

  pr-checklist:
    # Dependabot writes its own description; its PRs change no behavior and carry no spec.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - id: base
        uses: ./.github/actions/base-checks
        with:
          files: scripts/check_pr_body.ts .github/pull_request_template.md
      - working-directory: ${{ steps.base.outputs.root }}
        run: ./scripts/check_pr_body.ts --template .github/pull_request_template.md

  # Decides whether the tree holds an unarchived OpenSpec change. The verdict depends on the tree
  # alone, never on the draft state, so every run on a commit agrees.
  archive-verdict:
    runs-on: ubuntu-24.04
    outputs:
      archived: ${{ steps.verdict.outputs.archived }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - id: base
        uses: ./.github/actions/base-checks
        with:
          files: scripts/check_spec_archived.ts
      # Runs in the workspace, so it reads this pull request's openspec/changes/. Status 1 means a
      # change is unarchived, which is a state to wait in, not a failure; any other non-zero status
      # is the checker failing and fails the job.
      - id: verdict
        env:
          ROOT: ${{ steps.base.outputs.root }}
        run: |
          status=0
          "${ROOT}/scripts/check_spec_archived.ts" --ready || status=$?
          case "${status}" in
            0) echo "archived=true" >> "${GITHUB_OUTPUT}" ;;
            1) echo "archived=false" >> "${GITHUB_OUTPUT}" ;;
            *) exit "${status}" ;;
          esac

  # Carries the required check. It succeeds either way, but under the required name only when no
  # change is unarchived: while one is, nothing reports `spec-archived`, so the ruleset blocks the
  # merge and the run still succeeds. `awaiting-archive` is not a required check and never becomes
  # one (.agents/knowledge/github/checks.md).
  spec-archived:
    name: ${{ github.event.pull_request.draft && 'spec-archived' || needs.archive-verdict.outputs.archived == 'true' && 'spec-archived' || 'awaiting-archive' }}
    needs: archive-verdict
    runs-on: ubuntu-24.04
    steps:
      - env:
          ARCHIVED: ${{ needs.archive-verdict.outputs.archived }}
        run: |
          if [[ "${ARCHIVED}" == "true" ]]; then
            echo "No unarchived OpenSpec change."
          else
            echo "Waiting for the archive; the unarchived changes are named in the archive-verdict job."
          fi
