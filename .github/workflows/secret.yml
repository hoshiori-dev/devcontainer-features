# Scans the commits a pull request or a push to main adds for leaked credentials with TruffleHog.
# A finding verified as live, or one whose verification failed with an error, fails the job.
# Locally, pre-commit's gitleaks hook covers staged changes; job map:
# .agents/knowledge/github/checks.md.
name: Secret Scanning

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          # The image the action runs; it defaults to :latest, so it is pinned too. Bump it with the action.
          version: 3.97.9@sha256:52e67fef4d054ecff5c2ce4b4ae376626d1ef54aa0898b53cac19c25e92e14db
          extra_args: --results=verified,unknown
