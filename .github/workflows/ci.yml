# CI for pull requests and main. Static checks run on both. Container tests run only on pull
# requests and only for the features the change affects (scripts/affected.ts): one job per
# feature x compatibility image, one scenario job per feature, and the global scenarios when
# needed. A new push to a pull request cancels its running CI. `ci-gate` is the single required
# check; job map: .agents/knowledge/github/checks.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tools
      # shellcheck comes with the runner image.
      - run: just lint

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tools
      - run: just scripts-check

  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-tools
        with:
          devcontainer-cli: "true"
      - name: Validate features and version bumps
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        # A push that creates the branch has no previous commit (all zeros), and one after a force push
        # may name a vanished commit: then only the layout and metadata checks run. A pull request
        # always has its base, so a missing one fails there.
        run: |
          if [[ "$EVENT" == push ]]; then ./scripts/validate.ts --base "$BASE" --allow-missing-base; else just validate "$BASE"; fi
      - run: just docs-check

  spec:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tools
        with:
          openspec: "true"
      - run: just spec-check

  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      tests: ${{ steps.plan.outputs.tests }}
      scenarios: ${{ steps.plan.outputs.scenarios }}
      global: ${{ steps.plan.outputs.global }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-tools
      - id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/affected.ts --base "$BASE" --head HEAD --github >> "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.feature }}, ${{ matrix.image }}, ${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.tests != '[]'
    runs-on: ${{ matrix.runner }}
    # A hung image build would otherwise hold the runner and ci-gate for GitHub's 6-hour default.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.tests) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/feature-test
        with:
          mode: default
          feature: ${{ matrix.feature }}
          image: ${{ matrix.image }}
          remote-user: ${{ matrix.remoteUser }}

  test-scenarios:
    name: scenarios (${{ matrix.feature }})
    needs: plan
    if: needs.plan.outputs.scenarios != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.scenarios) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/feature-test
        with:
          mode: scenarios
          feature: ${{ matrix.feature }}

  test-global:
    needs: plan
    if: needs.plan.outputs.global == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/feature-test
        with:
          mode: global

  ci-gate:
    if: always()
    needs: [lint, scripts, validate, spec, plan, test, test-scenarios, test-global]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail when any job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
          if jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' <<< "$RESULTS" > /dev/null; then
            echo "::error::A CI job failed or was cancelled; open it above. Skipped jobs are expected when no feature is affected."
            exit 1
          fi
