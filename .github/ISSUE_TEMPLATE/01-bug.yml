name: Bug report
description: A published feature fails or behaves differently from its specification.
type: Bug
body:
  - type: input
    id: feature
    attributes:
      label: Feature
      description: Feature id and the version or tag you used, e.g. `node:1.4.0`.
    validations:
      required: true
  - type: input
    id: image
    attributes:
      label: Base image
      description: The image (and architecture, if not amd64) the dev container was built from.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happens
      description: The observed behavior, exactly. Paste build or install output rather than paraphrasing it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
      description: The intended behavior. Together with the field above this is the acceptance baseline for the fix.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: The smallest devcontainer.json (feature options included) and steps that show the problem.
      render: jsonc
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and references
      description: Tool versions, related issues or PRs, upstream changes you suspect.
    validations:
      required: false
