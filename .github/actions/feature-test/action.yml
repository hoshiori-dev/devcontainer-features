# Runs scripts/test_feature.ts — the same command `just test` runs locally — for one feature and
# image, one feature's scenarios, or the global scenarios. The script publishes a staged copy of
# the repository to a throwaway local registry, so in-repo dependencies resolve to this checkout,
# not to GHCR.
name: Test a feature
description: Run the devcontainer feature tests for one CI matrix entry.
inputs:
  mode:
    description: default (autogenerated + duplicate on one image), scenarios, or global.
    required: true
  feature:
    description: Feature id; empty for mode global.
    default: ""
  image:
    description: Base image for mode default.
    default: ""
  remote-user:
    description: Remote user for mode default; empty for the image's default.
    default: ""
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-tools
      with:
        devcontainer-cli: "true"
    - name: Run devcontainer features test
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        FEATURE: ${{ inputs.feature }}
        IMAGE: ${{ inputs.image }}
        REMOTE_USER: ${{ inputs.remote-user }}
      run: |
        args=(--mode "${MODE}")
        if [[ -n "${FEATURE}" ]]; then args+=(--feature "${FEATURE}"); fi
        if [[ -n "${IMAGE}" ]]; then args+=(--image "${IMAGE}"); fi
        if [[ -n "${REMOTE_USER}" ]]; then args+=(--remote-user "${REMOTE_USER}"); fi
        ./scripts/test_feature.ts "${args[@]}"
