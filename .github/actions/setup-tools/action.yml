# Installs the pinned toolchain CI jobs share: Deno always; just unless a job turns it off; the
# devcontainer CLI and OpenSpec when a job asks for them. Versions are pinned here and only here for
# CI; the dev container installs its own (see .agents/knowledge/github/checks.md).
name: Set up repository tools
description: Install Deno, just unless turned off, and on request the devcontainer CLI and OpenSpec.
inputs:
  devcontainer-cli:
    description: Install the devcontainer CLI.
    default: "false"
  just:
    description: Install just.
    default: "true"
  openspec:
    description: Install the OpenSpec CLI.
    default: "false"
runs:
  using: composite
  steps:
    - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      with:
        deno-version: v2.9.7
    - name: Install just
      if: inputs.just == 'true'
      shell: bash
      run: pipx install rust-just==1.58.0
    - name: Install the devcontainer CLI
      if: inputs.devcontainer-cli == 'true'
      shell: bash
      run: npm install --global @devcontainers/cli@0.89.0
    - name: Install OpenSpec
      if: inputs.openspec == 'true'
      shell: bash
      # Same permissions as .devcontainer/setup.sh grants the local install. edge.openspec.dev is the only host
      # OpenSpec contacts, for its anonymous telemetry, which the scripts turn off with OPENSPEC_TELEMETRY=0; the
      # host stays allowed so Deno never stops at a permission prompt.
      run: >-
        deno install --global --force
        --allow-read --allow-write --allow-env --allow-sys=cpus,homedir,uid --allow-net=edge.openspec.dev
        npm:@fission-ai/openspec@1.13.2
    - name: Put the OpenSpec binary on PATH
      if: inputs.openspec == 'true'
      shell: bash
      # deno install --global writes the openspec binary to $HOME/.deno/bin; later steps find it through PATH.
      run: printf '%s\n' "${HOME}/.deno/bin" >> "${GITHUB_PATH}"
